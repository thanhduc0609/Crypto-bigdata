[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bigdata"
version = "2.0.0"
description = "End-to-End Big Data Pipeline and XGBoost Price Direction Classifier for BTC-USDT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kafka-python>=3.0.11",
    "pyspark>=3.5.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.15.0",
    "xgboost>=2.0.0",
    "pyyaml>=6.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "websocket-client>=1.8.0",
    "flask>=3.0.0",
    "pyarrow>=15.0.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "filelock>=3.12.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.0"
]
